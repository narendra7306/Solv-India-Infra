apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/narendra7306/Solv-India-Infra.git
    targetRevision: eks
    path: replace
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
