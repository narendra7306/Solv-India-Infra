apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nginx-environments
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/narendra7306/Solv-India-Infra.git
        revision: eks
        directories:
          - path: "environments/*"
  template:
    metadata:
      name: 'nginx-{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/narendra7306/Solv-India-Infra.git
        targetRevision: eks
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'nginx-{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
